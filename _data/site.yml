field:
  intro: 기업, 군, 공공 현장에서 수강생이 직접 따라 하며 결과물을 만듭니다. 아래는 강의 후 수강생들이 단톡방에 남긴 후기입니다.
  gallery:
    - image: /images/army.jpg
      caption: 육군 종합행정학교 · AI 국방 행정 혁신
      wide: true
    - image: /images/hyundai.jpg
      caption: 현대해상 · 플래너 AI 콘텐츠
      wide: false
    - image: /images/postech-suno.jpg
      caption: 포항공대 포스코 국제관 · Suno 특강
      wide: false
    - image: /images/sotong-chatgpt.jpg
      caption: 소통교육원 · ChatGPT 특강
      wide: false
    - image: /images/ai-work.jpg
      caption: AI 업무 활용 강의
      wide: false
  boards:
    - org: LG생활건강
      course: AI 콘텐츠 교육 · 임직원
      reviews:
        - text: 짧은 시간에 두루두루 꼼꼼히 알려주셔서 여러 가지 시도를 해 볼 수 있었습니다. 교재를 따라가면서 시도해 볼 자신이 생겼습니다.
          by: 김○석 님
        - text: GPT와 캔바 두 가지 **업무에 유용하게 사용될 것** 같습니다! 신기하고 재미있었습니다.
          by: 팝콘 먹는 춘식이 님
        - text: 동영상부터 헤매기 시작했지만 알기 쉽게 알려주셔서 돌아가서 교재 보며 다시 한번 해보려 합니다.
          by: 김○진 님
    - org: 현대해상
      course: ChatGPT 활용 교육 · 플래너
      reviews:
        - text: 오늘 **우리에게 딱 필요한 정보들만** 넘 알차고 재미난 교육이었습니다. 지피티 잘 활용할 수 있을 것 같아요.
          by: 새론지점 지점장
        - text: 덕분에 지피티 활용법에 대해서 더 자세히 알게 됐습니다.
          by: 백○윤 팀장
        - text: 강의 너무 좋았어요. 꼭 필요한 정보 잘 이용할게요.
          by: 이○진 님
        - text: AI 활용법 알려주셔서 감사합니다. 잘 활용해보겠습니다.
          by: 조○선 님
    - org: 한국AI콘텐츠 연구소
      course: ChatGPT 온라인 특강 · 2026.09.22
      reviews:
        - text: 챗지피티 교육 **너무너무 유익했습니다!**
          by: 안뇽 님
        - text: 대충만 알고 있었는데 유익한 정보 활용 감사드립니다.
          by: HS 님
        - text: 평생 잊지 못할 강의 감사합니다.
          by: 서윤할배 님
        - text: 늦은 시간까지 열정적인 강의 멋지다.
          by: 김기삼 자전거 님
  reviews:
    - text: 어렵지 않으면서도 **바로 활용할 수 있는 실용적인 내용**이라 부담 없이 들을 수 있었습니다. 밝고 활기찬 목소리로 진행해 주셔서 집중하기가 훨씬 수월했고, 이론 위주가 아니라 **직접 따라 해볼 수 있는 실습 중심**이라 단순히 듣는 강의가 아니라 직접 써보는 경험을 할 수 있어 만족스러웠습니다.
      by: 민○서 님
      course: 캔바 AI 강의 수강
    - text: 캔바 강의를 통해 문서 작성, SNS 콘텐츠 제작, 프레젠테이션 등 다양한 기능을 배우며 큰 가능성을 발견했습니다. 특히 동영상 생성과 매직 레이어 기능이 인상 깊었고, **강사의 친절한 설명과 진행 덕분에 자신감을 얻어** 앞으로 적극 활용하고자 합니다.
      by: 해피바이러스 님
